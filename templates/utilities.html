<!-- styles in /static/style.css -->

<div id="util-unified">
  <div class="util-controls">
    <h3>Pipeline</h3>
    <div id="util-chain"></div>
    <button class="btn btn-sm" style="width:100%;margin-top:6px;" onclick="addStep()">+ Add Step</button>

    <button class="btn btn-primary" style="width:100%;margin-top:12px;" onclick="runPipeline()">Convert</button>

    <div class="util-divider"></div>

    <h3>Hash</h3>
    <button class="btn" style="width:100%;" onclick="generateHashes()">Hash Input</button>
    <div id="hash-results" class="hash-output"></div>
  </div>

  <div class="util-io">
    <div class="util-pane">
      <div class="util-pane-header">Input</div>
      <textarea id="util-input" placeholder="Paste text here..."></textarea>
    </div>
    <div class="util-pane">
      <div class="util-pane-header">
        Output
        <button class="btn btn-sm" onclick="copyOutput()">Copy</button>
      </div>
      <textarea id="util-output" placeholder="Result will appear here..." readonly></textarea>
    </div>
  </div>
</div>

<script>
var utilSteps = [];

function initUtilities() {
  utilSteps = [];
  addStep();
}

function addStep() {
  var idx = utilSteps.length;
  utilSteps.push('b64enc');

  var container = document.getElementById('util-chain');
  var row = document.createElement('div');
  row.className = 'util-step';
  row.setAttribute('data-idx', idx);

  var num = document.createElement('span');
  num.className = 'util-step-num';
  num.textContent = (idx + 1) + '.';

  var sel = document.createElement('select');
  sel.setAttribute('data-idx', idx);
  var ops = [
    ['b64enc','Base64 Encode'],['b64dec','Base64 Decode'],
    ['urlenc','URL Encode'],['urldec','URL Decode'],
    ['hexenc','Hex Encode'],['hexdec','Hex Decode'],
    ['htmlenc','HTML Encode'],['htmldec','HTML Decode'],
    ['rot','ROT13']
  ];
  for (var i = 0; i < ops.length; i++) {
    var opt = document.createElement('option');
    opt.value = ops[i][0];
    opt.textContent = ops[i][1];
    sel.appendChild(opt);
  }
  sel.onchange = function() { utilSteps[parseInt(this.getAttribute('data-idx'))] = this.value; };

  var del = document.createElement('button');
  del.className = 'btn btn-sm';
  del.textContent = '\u00d7';
  del.setAttribute('data-idx', idx);
  del.onclick = function() { removeStep(parseInt(this.getAttribute('data-idx'))); };

  row.appendChild(num);
  row.appendChild(sel);
  if (idx > 0) row.appendChild(del);
  container.appendChild(row);
}

function removeStep(idx) {
  utilSteps.splice(idx, 1);
  rebuildChainUI();
}

function rebuildChainUI() {
  var container = document.getElementById('util-chain');
  while (container.firstChild) container.removeChild(container.firstChild);
  var saved = utilSteps.slice();
  utilSteps = [];
  for (var i = 0; i < saved.length; i++) {
    addStep();
    utilSteps[i] = saved[i];
    container.lastChild.querySelector('select').value = saved[i];
  }
}

function applyOp(op, input) {
  switch(op) {
    case 'b64enc': return btoa(unescape(encodeURIComponent(input)));
    case 'b64dec': return decodeURIComponent(escape(atob(input.trim())));
    case 'urlenc': return encodeURIComponent(input);
    case 'urldec': return decodeURIComponent(input);
    case 'hexenc':
      return Array.from(new TextEncoder().encode(input))
        .map(function(b) { return b.toString(16).padStart(2, '0'); }).join(' ');
    case 'hexdec':
      var hex = input.replace(/\s+/g, '').replace(/0x/gi, '');
      var hexPairs = hex.match(/.{1,2}/g);
      if (!hexPairs) return '';
      return new TextDecoder().decode(new Uint8Array(hexPairs.map(function(b) { return parseInt(b, 16); })));
    case 'htmlenc':
      var d = document.createElement('div'); d.textContent = input; return d.innerHTML;
    case 'htmldec':
      var ta = document.createElement('textarea'); ta.innerHTML = input; return ta.value;
    case 'rot':
      return input.replace(/[a-zA-Z]/g, function(c) {
        var base = c <= 'Z' ? 65 : 97;
        return String.fromCharCode(((c.charCodeAt(0) - base + 13) % 26) + base);
      });
    default: return input;
  }
}

function runPipeline() {
  var val = document.getElementById('util-input').value;
  try {
    for (var i = 0; i < utilSteps.length; i++) {
      val = applyOp(utilSteps[i], val);
    }
  } catch(e) { val = 'Error at step ' + (i + 1) + ': ' + e.message; }
  document.getElementById('util-output').value = val;
}

function copyOutput() {
  navigator.clipboard.writeText(document.getElementById('util-output').value);
}

async function generateHashes() {
  var input = document.getElementById('util-input').value;
  var data = new TextEncoder().encode(input);
  var container = document.getElementById('hash-results');
  while (container.firstChild) container.removeChild(container.firstChild);

  var algos = ['SHA-1', 'SHA-256', 'SHA-384', 'SHA-512'];
  var hashes = {};
  for (var i = 0; i < algos.length; i++) {
    var buf = await crypto.subtle.digest(algos[i], data);
    hashes[algos[i]] = Array.from(new Uint8Array(buf)).map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
  }
  hashes['MD5'] = md5(input);

  ['MD5','SHA-1','SHA-256','SHA-384','SHA-512'].forEach(function(name) {
    var line = document.createElement('div'); line.className = 'hash-line';
    var label = document.createElement('span'); label.className = 'hash-label'; label.textContent = name;
    var val = document.createElement('code'); val.textContent = hashes[name];
    var btn = document.createElement('button'); btn.className = 'btn btn-sm'; btn.textContent = 'Copy';
    btn.setAttribute('data-hash', hashes[name]);
    btn.onclick = function() { navigator.clipboard.writeText(this.getAttribute('data-hash')); };
    line.appendChild(label); line.appendChild(val); line.appendChild(btn);
    container.appendChild(line);
  });
}

</script>
