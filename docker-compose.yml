version: '3.8'

services:
  ctf-toolkit:
    build: .
    container_name: ctf-toolkit
    ports:
      - "5000:5000"
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - FLASK_DEBUG=False
      - LOG_LEVEL=INFO
    volumes:
      # Persist data directories
      - ./tools:/app/tools
      - ./uploads:/app/uploads
      - ./downloads:/app/downloads
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - ctf-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  ctf-network:
    driver: bridge
