[pytest]
# Pytest configuration for CTF-toolkit

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --maxfail=3

# Markers for categorizing tests
markers =
    e2e: End-to-end tests
    unit: Unit tests
    integration: Integration tests
    slow: Tests that take a long time to run
    security: Security-related tests
    network: Tests that require network access

# Coverage options (if using pytest-cov)
[coverage:run]
source = .
omit =
    tests/*
    .venv/*
    venv/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
